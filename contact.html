<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | EVENSTAR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-contact">
    <header class="header">
        <div class="logo">EVENSTAR</div>
        <nav>
            <ul class="nav__list">
                <li><a href="index.html" class="nav__link">მთავარი</a></li>
                <li><a href="gallery.html" class="nav__link">გალერეა</a></li>
                <li><a href="about.html" class="nav__link">ჩემს შესახებ</a></li>
                <li><a href="services.html" class="nav__link">სერვისები</a></li>
                <li><a href="contact.html" class="nav__link">კონტაქტი</a></li>
            </ul>
        </nav>
    </header>

    <div class="form-container">
        <form id="contactForm">
            <fieldset>
                <legend>დაგვიკავშირდით</legend>
                
                <label for="name">თქვენი სახელი:</label>
                <input type="text" id="name" name="user_name" required placeholder="მაგ: გიორგი">

                <label for="email">ელ-ფოსტა:</label>
                <input type="email" id="email" name="user_email" required placeholder="example@mail.com">

                <label for="msg">შეტყობინება:</label>
                <textarea id="msg" name="message" rows="5" placeholder="როგორი ფოტოსესია გსურთ?"></textarea>                
                
                <button type="submit">გაგზავნა</button>
            </fieldset>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
